[project]
name = "lfhe"
version = "0.1.0"
description = "LFHÉ — AI-assisted, human-governed OSINT processing (Phase 1 foundation)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "py3langid>=0.3",
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]
s3 = ["boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/shared", "services/collector", "services/ai-orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["services/shared", "services/collector", "services/ai-orchestrator", "scripts"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "db: requires the throw-away PostgreSQL cluster",
]
