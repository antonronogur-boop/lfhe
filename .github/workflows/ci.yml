name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary, checksum verified) — full git history
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: repository secret scan
        run: python3 scripts/secret_scan.py

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: install PostgreSQL 16 binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: install locked dependencies (hash-checked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/py313-test.lock
          pip install --no-deps -e .
      - name: prompt artifacts unchanged since locking
        run: python scripts/prompt_registry.py check-lock
      - name: headless Chromium for the Phase 6 release PDF (preinstalled google-chrome)
        run: google-chrome --version
      - name: tests (throw-away PostgreSQL cluster)
        env:
          LFHE_CHROMIUM_NO_SANDBOX: "1"
        run: python -m pytest -W error::DeprecationWarning

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "apps/web/.nvmrc"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: build (placeholder public config only; no secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.invalid"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key-not-a-secret"

  e2e:
    # CR7-03: browser E2E of the full human-in-command path on a throw-away local stack (PostgreSQL + PostgREST +
    # test-only auth gateway + Next.js + the real worker loop with the SYNTHETIC_TEST_ONLY model). No secrets.
    runs-on: ubuntu-24.04
    needs: [python-tests, web]
    env:
      POSTGREST_VERSION: "12.2.3"
      POSTGREST_SHA256: "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v4
        with:
          node-version-file: "apps/web/.nvmrc"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install PostgreSQL 16 binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: install locked dependencies (hash-checked) + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/py313-test.lock
          pip install --no-deps -e .
          pip install playwright==1.56.0 pyee==13.0.1
          python -m playwright install --with-deps chromium
      - name: web dependencies
        working-directory: apps/web
        run: npm ci
      - name: PostgREST (pinned binary, checksum verified)
        run: |
          curl -sSL -o pgrst.tar.xz "https://github.com/PostgREST/postgrest/releases/download/v${POSTGREST_VERSION}/postgrest-v${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          echo "${POSTGREST_SHA256}  pgrst.tar.xz" | sha256sum -c -
          tar xf pgrst.tar.xz
          echo "LFHE_E2E_POSTGREST=$PWD/postgrest" >> "$GITHUB_ENV"
      - name: browser E2E
        env:
          LFHE_CHROMIUM_NO_SANDBOX: "1"
        run: python -m pytest -q tests/e2e -rA
